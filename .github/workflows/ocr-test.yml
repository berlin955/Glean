name: ocr-test
on:
  push:
    branches: [ocr-test]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: texture test
        shell: cmd
        run: |
          set "CSC=%windir%\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          "%CSC%" /nologo /target:winexe /optimize /codepage:65001 /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /out:tex.exe Glean.cs TexTest.cs /main:TexTest || exit /b 1
          start /wait tex.exe
          type out.txt
      - name: decode QR
        shell: pwsh
        run: |
          python -m pip install -q opencv-python-headless segno pyzbar pillow
          python decode.py
          python compare.py
          python decode2.py
      - uses: actions/upload-artifact@v4
        with:
          name: qr
          path: qr/
